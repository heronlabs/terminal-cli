# EasyPanel — REAL local instance (manual backup/rollup aid)
#
# This compose file is a MANUAL aid, NOT part of `pnpm test:unit` and NOT a
# deployment artifact. It brings up a real, local EasyPanel instance so you can
# exercise `hcli easypanel-backup` / `hcli easypanel-rollup` end to end against
# something that actually populates /etc/easypanel and /var/lib/docker.
#
#   docker compose -f docker-compose.easypanel.yml up
#
# `setup` bootstraps EasyPanel — it creates the long-running EasyPanel container
# itself via the Docker socket — and then EXITS. That one-shot exit is expected
# (so there is deliberately no `restart:` policy on it); EasyPanel keeps running.
#
# Then open http://localhost:3000, create a project/service so EasyPanel writes
# real state, and from the BUILT CLI (`pnpm build` → bin/) produce and inspect a
# real archive on the host:
#
#   sudo node bin/src/main.js easypanel-backup --local --filename easypanel.tar.gz
#   tar tzf easypanel.tar.gz | head            # inspect the snapshot
#   sudo node bin/src/main.js easypanel-rollup --local --filename easypanel.tar.gz
#
# ⚠️ Security & conflicts
# -----------------------
# - Mounting /var/run/docker.sock grants the EasyPanel container host-root-
#   equivalent control of Docker — it can start/stop/replace ANY container on
#   this host. Only run this on a machine you fully control.
# - Ports 80, 443 and 3000 are published on the host and may CONFLICT with other
#   services you already run locally. Stop those first or remap the ports.
# - `easypanel-backup` / `easypanel-rollup` themselves still run natively on the
#   host as root (they call `systemctl stop docker` and read the real host
#   paths); this compose only provides a real EasyPanel state to snapshot.

services:
  easypanel:
    image: easypanel/easypanel
    container_name: easypanel
    command: setup
    ports:
      - '80:80'
      - '443:443'
      - '3000:3000'
    volumes:
      - /etc/easypanel:/etc/easypanel
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-volumes:/var/lib/docker/volumes

volumes:
  docker-volumes: {}
