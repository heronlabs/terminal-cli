services:
  postgres:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - psql-data:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mydb']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ['--default-authentication-plugin=mysql_native_password']
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -proot']
      interval: 5s
      timeout: 5s
      retries: 10

  psql-integration:
    build:
      context: .
      dockerfile: integration-postgres.dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:postgres@postgres:5432/mydb
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_NAME: dummy-bucket

  mysql-integration:
    build:
      context: .
      dockerfile: integration-mysql.dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: mysql://mysql:mysql@mysql:3306/mydb
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_NAME: dummy-bucket

volumes:
  psql-data: {}
  mysql-data: {}
