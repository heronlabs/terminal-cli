name: '[ CD ] | Tags'

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      spec:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup-tags:
    name: 'Create release tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: heronlabs/action-tag-release-build@v3
        id: version
        with:
          github-token: ${{ secrets.PAT }}
          spec: ${{ inputs.spec || 'patch' }}

  publish-npm:
    name: 'Publish to npm'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish to public npm registry
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: 'Publish image (${{ matrix.image }})'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: terminal-cli
            dockerfile: Dockerfile
          - image: terminal-cli-cron-postgres
            dockerfile: cron-tab-postgres.dockerfile
          - image: terminal-cli-cron-mysql
            dockerfile: cron-tab-mysql.dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: heronlabs/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.setup-tags.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
