name: 'Continuous Deployment'

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      spec:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup-tags:
    name: 'Create release tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: heronlabs/action-tag-release-build@110eba825bcd5ec6d80fa24e712ad1a320b9482d # v3
        id: version
        with:
          github-token: ${{ secrets.PAT }}
          spec: ${{ inputs.spec || 'patch' }}

  publish-npm:
    name: 'Publish package to npm'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish to public npm registry
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report npm publish
        if: always()
        env:
          TAG: ${{ needs.setup-tags.outputs.tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          {
            echo "## 📦 npm publish"
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Package | \`${name}\` |"
            echo "| Version | \`${TAG}\` |"
            echo "| Registry | https://registry.npmjs.org |"
            echo "| Provenance | enabled |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    name: 'Publish image to docker'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: heronlabs/terminal-cli
          tags: |
            type=raw,value=${{ needs.setup-tags.outputs.tag }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
