name: '[ CD ] | Tags'

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Release model:
# - build-tag-release-action creates the immutable vX.Y.Z git tag (it also keeps
#   floating vX / vX.Y git tags, which this workflow intentionally does NOT mirror).
# - npm and Docker publish only the full version X.Y.Z. Docker carries no moving
#   tag at all; npm necessarily moves its `latest` dist-tag (unavoidable on
#   publish). There are no vX / vX.Y package/image tags, so out-of-order releases
#   can only ever affect npm `latest` — never a published version (immutable).
# - publish-npm and publish-docker run independently after the tag exists. A
#   partial failure (tag + one registry but not the other) is possible; the git
#   tag is the source of truth — re-publish the failed channel from the tag.

jobs:
  setup-tags:
    name: 'Create release tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }} # vX.Y.Z — checkout ref + version tag
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      # Bumps + commits the version and creates the vX.Y.Z tag (also keeps the
      # floating vX / vX.Y git tags, which this workflow does not publish).
      - uses: heronlabs/build-tag-release-action@v2
        id: version
        with:
          github-token: ${{ secrets.PAT }}
          spec: ${{ inputs.spec }}

  publish-npm:
    name: 'Publish to npm'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The checked-out tag already carries the bumped version (the release
      # action commits the bump before tagging), so no version edit is needed.
      # Publishes the full version X.Y.Z (npm sets `latest` to it). Provenance
      # gives a verifiable, public build-origin attestation.
      - name: Publish to public npm registry
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: 'Publish image (${{ matrix.image }})'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: terminal-cli
            dockerfile: Dockerfile
          - image: terminal-cli-cron-postgres
            dockerfile: cron-tab-postgres.dockerfile
          - image: terminal-cli-cron-mysql
            dockerfile: cron-tab-mysql.dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Full version vX.Y.Z only — immutable, no moving tag.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: heronlabs/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.setup-tags.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
