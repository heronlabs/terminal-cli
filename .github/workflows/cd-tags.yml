name: '[ CD ] | Tags'

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Release model assumptions:
# - build-tag-release-action creates the vX.Y.Z tag and force-updates the
#   floating git tags vX and vX.Y. This workflow mirrors those same names onto
#   npm (dist-tags) and Docker (image tags), plus `latest`.
# - Releases are strictly FORWARD-MOVING. Every floating pointer (git, npm and
#   docker) is repointed unconditionally — exactly as the release action already
#   force-pushes vX / vX.Y — so dispatching from an older line (e.g. a 1.4.x
#   patch after 2.0.0 already exists) moves those pointers BACKWARD. Release
#   older lines with care, or add a semver guard before the pointer moves.
# - publish-npm and publish-docker run independently after the tag exists. A
#   partial failure (tag + one registry but not the other) is possible; the git
#   tag is the source of truth — re-publish the failed channel from the tag.

jobs:
  setup-tags:
    name: 'Create release tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }} # vX.Y.Z (checkout ref)
      version: ${{ steps.version.outputs.version }} # X.Y.Z (npm semver)
      major-tag: ${{ steps.version.outputs.major-tag }} # vX (floating)
      minor-tag: ${{ steps.version.outputs.minor-tag }} # vX.Y (floating)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      # Bumps + commits the version, creates the vX.Y.Z tag, and force-updates
      # the floating git tags vX / vX.Y. Outputs: version, tag, major-tag, minor-tag.
      - uses: heronlabs/build-tag-release-action@v2
        id: version
        with:
          github-token: ${{ secrets.PAT }}
          spec: ${{ inputs.spec }}

  publish-npm:
    name: 'Publish to npm'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The checked-out tag already carries the bumped version (the release
      # action commits the bump before tagging), so no version edit is needed.
      # Provenance gives a verifiable, public build-origin attestation.
      - name: Publish to public npm registry
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm versions are immutable, so the floating vX / vX.Y pointers (the same
      # names the release action gives the git tags) are modeled as dist-tags
      # (install via `npm i @heronlabs/terminal-cli@v1`).
      - name: Move floating dist-tags (major, minor)
        run: |
          npm dist-tag add "@heronlabs/terminal-cli@${VERSION}" "${MAJOR_TAG}"
          npm dist-tag add "@heronlabs/terminal-cli@${VERSION}" "${MINOR_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.setup-tags.outputs.version }}
          MAJOR_TAG: ${{ needs.setup-tags.outputs.major-tag }}
          MINOR_TAG: ${{ needs.setup-tags.outputs.minor-tag }}

  publish-docker:
    name: 'Publish image (${{ matrix.image }})'
    needs: setup-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: terminal-cli
            dockerfile: Dockerfile
          - image: terminal-cli-cron-postgres
            dockerfile: cron-tab-postgres.dockerfile
          - image: terminal-cli-cron-mysql
            dockerfile: cron-tab-mysql.dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup-tags.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build, many tags: vX.Y.Z + the floating vX.Y / vX / latest pointers.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: heronlabs/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.setup-tags.outputs.tag }}
            type=raw,value=${{ needs.setup-tags.outputs.minor-tag }}
            type=raw,value=${{ needs.setup-tags.outputs.major-tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
